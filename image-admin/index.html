<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片管理工具 - 迪彼科技</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      line-height: 1.5;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      background: white;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    header h1 { font-size: 24px; font-weight: 700; color: #1e3a5f; }
    header p { color: #64748b; margin-top: 6px; font-size: 14px; }
    .section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #1e3a5f;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title span {
      background: #3b82f6;
      color: white;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      background: #f8fafc;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    .card-header {
      padding: 14px 16px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    .card-kicker {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
    }
    .card-filename {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      font-family: monospace;
    }
    .preview-area {
      height: 180px;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .preview-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .preview-area .placeholder {
      color: #94a3b8;
      font-size: 14px;
    }
    .card-actions {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: white;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    label.file-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      background: #3b82f6;
      color: white;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    label.file-btn:hover { background: #2563eb; }
    label.file-btn input { display: none; }
    button.download-btn {
      flex: 1;
      padding: 9px 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.download-btn:hover { background: #059669; }
    button.download-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    .status {
      font-size: 12px;
      color: #64748b;
      min-height: 18px;
    }
    .status.success { color: #059669; }
    .status.error { color: #dc2626; }
    .tip {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 24px;
    }
    .tip strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>图片管理工具</h1>
      <p>单独用于替换「产品中心」和「解决方案」图片 · 与官网页面完全分离</p>
    </header>

    <div class="tip">
      <strong>使用说明</strong>
      1. 点击「选择新图片」上传你想替换的高清图<br>
      2. 预览满意后点击「下载替换文件」，会自动按正确文件名下载<br>
      3. 把下载的文件直接覆盖到项目 <code>images/</code> 文件夹即可
    </div>

    <!-- 解决方案 -->
    <div class="section">
      <div class="section-title">
        核心解决方案
        <span>6 张</span>
      </div>
      <div class="grid" id="solutions-grid"></div>
    </div>

    <!-- 产品中心 -->
    <div class="section">
      <div class="section-title">
        产品中心
        <span>8 张</span>
      </div>
      <div class="grid" id="products-grid"></div>
    </div>
  </div>

  <script>
    // 明确的标题与文件名对应关系
    const solutions = [
      {
        id: "sol-2",
        filename: "sol-2.jpg",
        kicker: "eVTOL · 物流领域 30kg 级",
        title: "eVTOL 物流领域解决方案",
        desc: "提供近距离物流运输，载重 30kg 级。"
      },
      {
        id: "sol-3",
        filename: "sol-3.jpg",
        kicker: "eVTOL · 民用领域 100kg 级",
        title: "eVTOL 民用领域解决方案",
        desc: "提供旅游高空观光、近距离载人交通、近距离医疗救援。"
      },
      {
        id: "sol-1",
        filename: "sol-1.jpg",
        kicker: "eVTOL · 紧急救援 300kg 级以上",
        title: "eVTOL 紧急救援领域解决方案",
        desc: "针对海上、滩涂、山林区提供高空运输和救援。"
      },
      {
        id: "sol-4",
        filename: "sol-4.jpg",
        kicker: "eVTOL · 建筑工程 200kg 级",
        title: "eVTOL 建筑工程领域解决方案",
        desc: "提供海上、滩涂、山区、林区物资运输。"
      },
      {
        id: "sol-5",
        filename: "sol-5.jpg",
        kicker: "汽车声学 · ENC / RNC / ESE / AVAS",
        title: "汽车声学领域解决方案",
        desc: "针对发动机引起的 Booming noise，适用于控制 20-200Hz 内的阶次噪声。"
      },
      {
        id: "sol-6",
        filename: "sol-6.jpg",
        kicker: "汽车设计 · VMD",
        title: "VMD 悬置优化专家系统",
        desc: "汽车设计领域动力总成悬置设计优化解决方案。"
      }
    ];

    const products = [
      {
        id: "product-8",
        filename: "product-8.jpg",
        title: "EVTOL 载人飞行器"
      },
      {
        id: "product-7",
        filename: "product-7.jpg",
        title: "ANC&ESE&AVAS 数字模块"
      },
      {
        id: "product-6",
        filename: "product-6.jpg",
        title: "VMD 动力总成悬置设计专家系统"
      },
      {
        id: "product-4",
        filename: "product-4.jpg",
        title: "荣获“2019年创业在上海”"
      },
      {
        id: "product-5",
        filename: "product-5.jpg",
        title: "引擎声浪系统"
      },
      {
        id: "product-3",
        filename: "product-3.jpg",
        title: "油门加速引擎声浪控制系统"
      },
      {
        id: "product-2",
        filename: "product-2.jpg",
        title: "油门加速控制系统"
      },
      {
        id: "product-1",
        filename: "product-1.jpg",
        title: "汽车发动机主动降噪 ANC"
      }
    ];

    // 当前选择的新文件（内存中）
    const selectedFiles = {};

    function createCard(item, type) {
      const card = document.createElement("div");
      card.className = "card";
      card.id = `card-${item.id}`;

      const kickerHtml = item.kicker ? `<div class="card-kicker">${item.kicker}</div>` : "";
      const descHtml = item.desc ? `<div style="font-size:12px;color:#64748b;margin-top:4px;">${item.desc}</div>` : "";

      card.innerHTML = `
        <div class="card-header">
          ${kickerHtml}
          <div class="card-title">${item.title}</div>
          <div class="card-filename">${item.filename}</div>
          ${descHtml}
        </div>
        <div class="preview-area" id="preview-${item.id}">
          <div class="placeholder">选择图片后在此预览</div>
        </div>
        <div class="card-actions">
          <div class="btn-row">
            <label class="file-btn">
              选择新图片
              <input type="file" accept="image/*" data-id="${item.id}" data-filename="${item.filename}">
            </label>
            <button class="download-btn" disabled data-id="${item.id}" data-filename="${item.filename}">
              下载替换文件
            </button>
          </div>
          <div class="status" id="status-${item.id}"></div>
        </div>
      `;

      // 事件绑定
      const fileInput = card.querySelector('input[type="file"]');
      const downloadBtn = card.querySelector('.download-btn');
      const preview = card.querySelector(`#preview-${item.id}`);
      const status = card.querySelector(`#status-${item.id}`);

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          status.textContent = "请选择图片文件";
          status.className = "status error";
          return;
        }

        selectedFiles[item.id] = file;
        const url = URL.createObjectURL(file);
        preview.innerHTML = `<img src="${url}" alt="预览">`;
        downloadBtn.disabled = false;
        status.textContent = `已选择：${file.name} (${(file.size/1024).toFixed(0)} KB)`;
        status.className = "status success";
      });

      downloadBtn.addEventListener("click", () => {
        const file = selectedFiles[item.id];
        if (!file) return;

        // 创建正确文件名的下载
        const a = document.createElement("a");
        a.href = URL.createObjectURL(file);
        a.download = item.filename;   // 强制使用正确的文件名
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        status.textContent = `已下载 ${item.filename}，请覆盖到 images/ 文件夹`;
        status.className = "status success";
      });

      return card;
    }

    // 渲染
    const solutionsGrid = document.getElementById("solutions-grid");
    solutions.forEach(item => solutionsGrid.appendChild(createCard(item, "solution")));

    const productsGrid = document.getElementById("products-grid");
    products.forEach(item => productsGrid.appendChild(createCard(item, "product")));
  </script>
</body>
</html>
